name: Deploy pie gallery

on:
  push:
    branches:
      - main
    paths:
      - "docs/pie-selection.html"
      - "docs/pi-splash.png"
      - ".github/workflows/deploy-gallery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage gallery and splash screenshot
        run: |
          mkdir -p _site
          cp docs/pie-selection.html _site/pie-selection.html
          cp docs/pi-splash.png _site/pi-splash.png
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
